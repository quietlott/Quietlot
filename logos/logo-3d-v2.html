<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quietlot logo 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff; font-family: Helvetica, Arial, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  .word { position: fixed; left: 0; right: 0; bottom: 92px; text-align: center; font-size: clamp(34px, 8vw, 64px); font-weight: 600; letter-spacing: -0.03em; pointer-events: none; }
  .bar { position: fixed; left: 0; right: 0; bottom: 28px; display: flex; justify-content: center; gap: 8px; }
  .bar button { background: transparent; color: #8a8a8a; border: 1px solid #333; padding: 8px 14px; font: 11px ui-monospace, Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
  .bar button.on { color: #fff; border-color: #fff; }
  .hint { position: fixed; top: 20px; left: 0; right: 0; text-align: center; color: #666; font: 11px ui-monospace, Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">Drag to rotate</div>
<div class="word">Quietlot</div>
<div class="bar">
  <button data-k="I" class="on">I · Two halves</button>
  <button data-k="J">J · Square Q</button>
</div>
<script type="module">
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';

const MARKS = {
  I: `<svg viewBox="0 0 512 512">
    <path d="M236 60A196 196 0 0 0 236 452V372A116 116 0 0 1 236 140Z"/>
    <path d="M276 60A196 196 0 0 1 452 276H372A116 116 0 0 0 276 140Z"/>
    <path d="M276 316H452V452H276Z"/></svg>`,
  J: `<svg viewBox="0 0 512 512">
    <path d="M64 64H400V312H336V128H128V384H312V448H64Z"/>
    <path d="M352 352H448V448H352Z"/></svg>`
};

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);

scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(4, 6, 6); key.castShadow = true; scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.9);
rim.position.set(-6, -2, -4); scene.add(rim);

const material = new THREE.MeshStandardMaterial({ color: 0xf2f2f2, metalness: 0.2, roughness: 0.32 });
const accent = new THREE.MeshStandardMaterial({ color: 0xbfbfbf, metalness: 0.6, roughness: 0.25 });

const loader = new SVGLoader();
const S = 3.2 / 512;
const depth = 80; // in SVG units
const extrude = { depth, bevelEnabled: true, bevelThickness: 8, bevelSize: 5, bevelSegments: 5, curveSegments: 64 };

const holder = new THREE.Group();
scene.add(holder);
let group = null;

function build(k) {
  if (group) { holder.remove(group); group.traverse(o => o.geometry && o.geometry.dispose()); }
  group = new THREE.Group();
  const data = loader.parse(MARKS[k]);
  data.paths.forEach((p, i) => {
    const last = i === data.paths.length - 1; // tail block = the "lot"
    for (const shape of SVGLoader.createShapes(p)) {
      const g = new THREE.ExtrudeGeometry(shape, { ...extrude, depth: last ? depth * 1.5 : depth });
      const m = new THREE.Mesh(g, last ? accent : material);
      m.castShadow = m.receiveShadow = true;
      group.add(m);
    }
  });
  // SVG y points down: flip, scale and centre.
  group.scale.set(S, -S, S);
  group.position.set(-256 * S, 256 * S + 0.35, -depth * S / 2);
  holder.add(group);
}
build('I');

document.querySelectorAll('.bar button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.bar button').forEach(x => x.classList.toggle('on', x === b));
  build(b.dataset.k);
}));

const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.ShadowMaterial({ opacity: 0.35 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -2.1; floor.receiveShadow = true;
scene.add(floor);

function fit() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.position.set(0, 0.35, camera.aspect < 0.8 ? 11 : 8.5);
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
fit();
window.addEventListener('resize', fit);

let dragging = false, lastX = 0, lastY = 0, velX = 0, velY = 0;
holder.rotation.set(-0.25, 0.55, 0);
canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => dragging = false);
canvas.addEventListener('pointercancel', () => dragging = false);
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  velY = (e.clientX - lastX) * 0.005; velX = (e.clientY - lastY) * 0.005;
  lastX = e.clientX; lastY = e.clientY;
  holder.rotation.y += velY; holder.rotation.x += velX;
});

(function animate() {
  requestAnimationFrame(animate);
  if (!dragging) {
    velX *= 0.95; velY *= 0.95;
    holder.rotation.y += velY; holder.rotation.x += velX;
    if (Math.abs(velY) < 0.0005) holder.rotation.y += 0.0025;
    holder.rotation.x = Math.max(-1.1, Math.min(1.1, holder.rotation.x));
  }
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
