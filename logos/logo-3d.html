<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quietlot logo 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #000000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  .hint { position: fixed; left: 0; right: 0; bottom: 24px; text-align: center; color: #8a8a8a; font: 12px ui-monospace, Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">Drag to rotate</div>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 9);

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(4, 6, 6);
key.castShadow = true;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.8);
rim.position.set(-6, -2, -4);
scene.add(rim);

const material = new THREE.MeshStandardMaterial({ color: 0xf2f2f2, metalness: 0.15, roughness: 0.35 });

// Concept B: two L-shaped blocks, the overlap is left empty (the quiet centre).
// Coordinates follow the 96x96 SVG, with y flipped so the mark stands upright.
const S = 1 / 48; // scale: 96 units -> 2 world units, centred later
function pts(list) { return list.map(([x, y]) => new THREE.Vector2((x - 48) * S, (48 - y) * S)); }

const blockA = new THREE.Shape(pts([[0, 0], [64, 0], [64, 32], [32, 32], [32, 64], [0, 64]]));
const blockB = new THREE.Shape(pts([[64, 32], [96, 32], [96, 96], [32, 96], [32, 64], [64, 64]]));

const depth = 0.7;
const extrude = { depth, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.06, bevelSegments: 4, curveSegments: 12 };

const group = new THREE.Group();
for (const shape of [blockA, blockB]) {
  const mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, extrude), material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);
}
group.position.z = -depth / 2;
scene.add(group);

// Soft floor shadow
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 12),
  new THREE.ShadowMaterial({ opacity: 0.35 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.4;
floor.receiveShadow = true;
scene.add(floor);

// Drag to rotate, with gentle inertia.
let dragging = false, lastX = 0, lastY = 0;
let velX = 0, velY = 0;
const base = { x: -0.35, y: 0.5 };
group.rotation.set(base.x, base.y, 0);

canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => dragging = false);
canvas.addEventListener('pointercancel', () => dragging = false);
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  velY = dx * 0.005;
  velX = dy * 0.005;
  group.rotation.y += velY;
  group.rotation.x += velX;
});

function animate() {
  requestAnimationFrame(animate);
  if (!dragging) {
    velX *= 0.95; velY *= 0.95;
    group.rotation.y += velY;
    group.rotation.x += velX;
    // Slow idle spin when nothing is happening.
    if (Math.abs(velY) < 0.0005) group.rotation.y += 0.0015;
    group.rotation.x = Math.max(-1.2, Math.min(1.2, group.rotation.x));
  }
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
