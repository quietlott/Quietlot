<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>Quietlot logo F: lot grid forming a Q</title>
  <!-- Eight parcels form a ring; the centre stays empty (quiet) -->
  <g fill="#000">
    <rect x="60"  y="60"  width="120" height="120"/>
    <rect x="240" y="60"  width="120" height="120"/>
    <rect x="420" y="60"  width="120" height="120"/>
    <rect x="60"  y="240" width="120" height="120"/>
    <rect x="420" y="240" width="120" height="120"/>
    <rect x="60"  y="420" width="120" height="120"/>
    <rect x="240" y="420" width="120" height="120"/>
    <!-- Tail parcel, pushed diagonally out of the grid, makes it read as Q -->
    <rect x="450" y="450" width="120" height="120"/>
  </g>
</svg>
